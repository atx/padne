name: Run Tests

on: [push, pull_request]
permissions:
  checks: write
  contents: read

jobs:
  build_and_test:
    name: "Run Tests (${{ matrix.name }})"
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: "Ubuntu 24.04, KiCad 9.0"
            os: ubuntu-24.04
            kicad-version: '9.0'
          - name: "Ubuntu 24.04, KiCad 10.0"
            os: ubuntu-24.04
            kicad-version: '10.0'
          - name: "Ubuntu 26.04, KiCad 10.0"
            os: ubuntu-26.04
            kicad-version: '10.0'
          - name: "Ubuntu 26.04, KiCad 10.0, no MKL"
            os: ubuntu-26.04
            kicad-version: '10.0'
            mkl: 'false'
          - name: "Debian sid, KiCad 10.0"
            os: ubuntu-24.04
            container: 'debian:sid'
    steps:
    # actions/checkout needs git in the container, otherwise it downloads a REST
    # API tarball, which cannot fetch submodules. sudo is a no-op here (we are
    # already root), but lets setup-padne run unmodified. The workspace belongs
    # to the host runner user, so git needs it marked safe for the root we run
    # as - checkout only does so in a temporary config that later steps lose.
    - name: Bootstrap container
      if: matrix.container
      run: |
        apt-get update
        apt-get install -y git sudo
        git config --global --add safe.directory "$GITHUB_WORKSPACE"

    - name: Check out repository
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Setup Padne
      uses: ./.github/actions/setup-padne
      with:
        kicad-version: ${{ matrix.kicad-version }}
        mkl: ${{ matrix.mkl || 'true' }}

    - name: Run tests with pytest and generate report
      run: |
        python3 -m pytest --junitxml=pytest-results.xml

    - name: Publish Test Results
      uses: dorny/test-reporter@v1
      if: always() # Always run this step to publish results, even if tests fail
      with:
        name: Pytest Results (${{ matrix.name }})
        path: pytest-results.xml
        reporter: java-junit
        fail-on-error: 'true'
        badge-title: 'Tests (${{ matrix.name }})'
