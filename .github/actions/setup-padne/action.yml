name: 'Setup padne'
description: 'Install system dependencies, KiCad, and padne itself'
inputs:
  kicad-version:
    description: 'KiCad major.minor version to install (e.g. 9.0, 10.0). Ubuntu only, Debian uses the packaged KiCad.'
    required: false
    default: '9.0'
  mkl:
    description: 'Install Intel oneMKL so that the PARDISO solver backend gets built'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-full python3-dev python3-pip git libegl1 libegl1-mesa-dev libmpfr-dev libgmp-dev libboost-dev

    - name: Install KiCad
      shell: bash
      run: |
        # Ubuntu needs the PPA to get a current KiCad, Debian ships it directly.
        . /etc/os-release
        if [ "$ID" = "ubuntu" ]; then
          sudo add-apt-repository --yes ppa:kicad/kicad-${{ inputs.kicad-version }}-releases
          sudo apt-get update
        fi
        sudo apt-get install -y --no-install-recommends kicad

    - name: Install MKL
      if: inputs.mkl == 'true'
      shell: bash
      run: |
        pip3 install --break-system-packages --user mkl mkl-include
        # The wheels land in the --user prefix, which CMake does not search by default
        echo "MKLROOT=$HOME/.local" >> $GITHUB_ENV

    - name: Build C++ part of the repository, install the package
      shell: bash
      run: |
        pip3 install --break-system-packages --user -e .[test] -v

    - name: Check that the PARDISO backend got built
      if: inputs.mkl == 'true'
      shell: bash
      run: |
        python3 -c "import padne._pardiso"
