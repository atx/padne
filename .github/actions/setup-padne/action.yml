name: 'Setup padne'
description: 'Install system dependencies, KiCad, and padne itself'
inputs:
  kicad-version:
    description: 'KiCad major.minor version to install (e.g. 9.0, 10.0). Ubuntu only, Debian uses the packaged KiCad.'
    required: false
    default: '9.0'
  mkl:
    description: 'Install the runtime MKL (pardiso extra), _pardiso is built either way'
    required: false
    default: 'true'
runs:
  using: 'composite'
  steps:
    - name: Install system dependencies
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y python3-full python3-dev python3-pip git libegl1 libegl1-mesa-dev libmpfr-dev libgmp-dev libboost-dev

    - name: Install KiCad
      shell: bash
      run: |
        # Ubuntu needs the PPA to get a current KiCad, Debian ships it directly.
        . /etc/os-release
        if [ "$ID" = "ubuntu" ]; then
          sudo add-apt-repository --yes ppa:kicad/kicad-${{ inputs.kicad-version }}-releases
          sudo apt-get update
        fi
        sudo apt-get install -y --no-install-recommends kicad

    - name: Build C++ part of the repository, install the package
      shell: bash
      run: |
        if [ "${{ inputs.mkl }}" = "true" ]; then
          pip3 install --break-system-packages --user -e .[test,pardiso] -v
        else
          pip3 install --break-system-packages --user -e .[test] -v
        fi

    - name: Check that _pardiso links the pip MKL relative to itself
      shell: bash
      run: |
        # find_spec locates the (editable-installed) .so without loading MKL
        so=$(python3 -c "import importlib.util; print(importlib.util.find_spec('padne._pardiso').origin)")
        readelf -d $so | tee /dev/stderr | grep -q 'NEEDED.*\[libmkl_rt\.so\.[0-9]*\]'
        readelf -d $so | grep -q 'R.*PATH.*\[\$ORIGIN/\.\./\.\./\.\.\]'

    - name: Check that the PARDISO backend is usable
      if: inputs.mkl == 'true'
      shell: bash
      run: |
        python3 -c "import padne._pardiso"

    - name: Check that padne falls back to SciPy without the runtime MKL
      if: inputs.mkl != 'true'
      shell: bash
      run: |
        python3 -c "from padne import solver; assert solver.solver_backends() == [solver.SolverBackend.SCIPY]"
